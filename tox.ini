[tox]
requires =
    tox>=4.32
env_list =
    cog
    cli
    lint
    mypy
    pins
    py{py3}
    py{311-315}
    py{314-315}t

[testenv]
extras =
    tests
commands =
    {envpython} -m pytest \
      --cov norwegianblue \
      --cov tests \
      --cov-report html \
      --cov-report term \
      --cov-report xml \
      {posargs}

[testenv:cog]
skip_install = true
deps =
    cogapp
commands =
    cog -Pr README.md

[testenv:cli]
commands =
    norwegianblue --version
    norwegianblue --help
    eol --version
    eol --help

[testenv:lint]
skip_install = true
deps =
    prek
commands =
    prek run --all-files --show-diff-on-failure

[testenv:mypy]
deps =
    -r requirements-mypy.txt
commands =
    mypy src {posargs}

[testenv:pins]
deps =
    -r requirements.txt
extras =
